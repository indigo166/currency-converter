<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Converter">
  <meta name="theme-color" content="#0e1419">
  <meta name="description" content="Calculator that converts while you compute — USD, JPY, COP and 29 more.">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script src="version.js"></script>
  <!-- Every other file is requested with the version on its URL. A release then asks for
       addresses no cache has ever seen, so a stale copy of one file can't be mixed into a
       new version — which is exactly what happened on the first 1.1.0 deploy (fresh
       version file, 10-minute-old app.js from the browser's HTTP cache). -->
  <script>document.write('<link rel="stylesheet" href="styles.css?v=' + encodeURIComponent(AppVersion.VERSION) + '">');</script>
  <title>Currency Converter</title>
</head>
<body>
  <div id="app">
    <header id="topbar"></header>
    <main id="view"></main>
    <section id="pad" aria-label="Keypad"></section>
    <nav id="tabs"></nav>
  </div>
  <div id="chart" class="overlay" hidden></div>
  <div id="sheet" class="sheet-wrap" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    var v = encodeURIComponent(AppVersion.VERSION);
    document.write('<script src="core.js?v=' + v + '"><\/script><script src="app.js?v=' + v + '"><\/script>');
  </script>
</body>
</html>
